# No fallback to development DB_* credentials.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/lancerpick_test?connectionTimeZone=UTC}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}

# Keep room for the four-worker concurrency tests without filling MySQL's
# connection limit with idle pools retained by separate Spring test contexts.
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1

# Tests use a provider double or a local HTTP stub, never the external Toss API.
# Do not inherit the developer's top-up activation or require a personal secret.
toss.topup-enabled=false

# Tests delete their own fixtures. Run the outbox dispatcher explicitly instead of on a schedule
# so background notifications never reference rows another test is cleaning up.
lancerpick.notifications.dispatch-enabled=false
