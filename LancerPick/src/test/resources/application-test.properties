# No fallback to development DB_* credentials.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/lancerpick_test?connectionTimeZone=UTC}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}

# Keep room for the four-worker concurrency tests without filling MySQL's
# connection limit with idle pools retained by separate Spring test contexts.
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1

# Tests use a provider double or a local HTTP stub, never the external Toss API.
# Do not inherit the developer's top-up activation or require a personal secret.
toss.topup-enabled=false

# Tests delete their own fixtures. Run the outbox dispatcher explicitly instead of on a schedule
# so background notifications never reference rows another test is cleaning up.
lancerpick.notifications.dispatch-enabled=false

# Tests register their own AccountMailSender double. Never pick up a developer's MAIL_ENABLED=true
# (a second sender bean would break the password-reset tests and could reach a real SMTP server).
lancerpick.mail.enabled=false
lancerpick.mail.reconciliation.enabled=false
# Auto confirmation timers are expired explicitly through ReviewTimerService.expireDue in tests.
lancerpick.order.review-timer.expiry-enabled=false
# Fixtures are cleaned explicitly; retry scheduling is opted into only by dedicated tests.
lancerpick.member.security-lock-retry.enabled=false
# Recovery tests opt in explicitly. Never inherit a developer's automatic external lookup settings.
lancerpick.wallet.topup-recovery.enabled=false
lancerpick.wallet.topup-recovery.scheduling-enabled=false
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

# Existing order/payment regression tests create LEGACY_V1 orders. V3 tests turn full funding on explicitly.
lancerpick.order.full-funding-creation-enabled=false
