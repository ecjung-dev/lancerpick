spring.application.name=LancerPick

# HQL ON CONFLICT DO NOTHING: report actual changes, not matched no-op rows.
# Initial wallet creation must distinguish inserted=1 from duplicate=0.
spring.datasource.hikari.data-source-properties.useAffectedRows=true

server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
toss.secret-key=${TOSS_SECRET_KEY}
toss.topup-enabled=${TOSS_TOPUP_ENABLED:true}


# Password-reset links point only to this fixed frontend origin (never the request Host header).
lancerpick.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
# HMAC key for auth_request_limits.subject_hmac. Set it in your own untracked config/env; never commit a real value.
# If empty, a random key is generated at startup (rate-limit rows do not carry over across restarts).
lancerpick.auth.request-limit-key=${AUTH_REQUEST_LIMIT_KEY:}

# C3 account mail (password reset). Off by default: the app starts without a mail server and
# account mails are recorded as FAILED(MAIL_NOT_CONFIGURED). For local Mailpit see docs/mail-infrastructure.md.
lancerpick.mail.enabled=${MAIL_ENABLED:false}
lancerpick.mail.from=${MAIL_FROM:LancerPick <no-reply@lancerpick.local>}
lancerpick.mail.queue-capacity=${MAIL_QUEUE_CAPACITY:100}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
# Bound SMTP waits so one stuck send cannot block the single mail worker forever.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# CONTRACT_V2 new-order creation stays closed until G1 (V2 commands/UI + real-DB race checks).
lancerpick.order.contract-v2-creation-enabled=false
# Full funding remains closed until payment/payout/refund/timer APIs pass the V3 activation gate.
lancerpick.order.full-funding-creation-enabled=false

# Framework frame-error logs can include CONNECT CSRF headers and private message payloads.
# ChatSocketErrorHandler logs only a fixed safe rejection code instead.
logging.level.org.springframework.web.socket.messaging.StompSubProtocolHandler=OFF
