spring.application.name=LancerPick

# HQL ON CONFLICT DO NOTHING: report actual changes, not matched no-op rows.
# Initial wallet creation must distinguish inserted=1 from duplicate=0.
spring.datasource.hikari.data-source-properties.useAffectedRows=true

server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
toss.secret-key=${TOSS_SECRET_KEY}
toss.topup-enabled=${TOSS_TOPUP_ENABLED:true}


# CONTRACT_V2 new-order creation stays closed until G1 (V2 commands/UI + real-DB race checks).
lancerpick.order.contract-v2-creation-enabled=false
